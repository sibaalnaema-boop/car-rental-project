<!DOCTYPE html>
<html>
    <head>
        <title>Car Booking</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>

<body>

    <h1>Book Your Car</h1>

    <form id="booking-form">

        <label>Customer Name:</label>
        <input type="text" id="fullName" placeholder="Enter your name">
        <br><br>

<label>National ID:</label>
<input type="text" id="nationalId" placeholder="Enter 11 digits" required>

<br><br>

<label>Select Car:</label>
<select id="carSelect" required>
    <option value="">Choose a car</option>
    <option value="50">Toyota Camry</option>
    <option value="200">BMW 5 Series</option>
    <option value="100">Mercedes C-Class</option>
</select>

<br><br>

<label>Pickup Date:</label>
<input type="date" id="pickupDate" required>

<br><br>

<label>Return Date:</label>
<input type="date" id="returnDate" required>
<br><br>

<label>Mobile Number:</label>
<input type="tel" id="mobile" placeholder="MTN or Syriatel">

<br><br>

<label>Email:</label>
<input type="email" id="email" placeholder="Enter your email">

        <br><br>

        <button type="submit">Confirm Booking</button>
        <button type="button" onclick="calculateDays()">Test JavaScript</button>

    </form>
    <br><br>
    <a href="Cars.html" class="back-link">Back to Cars</a>
    <script src="script.js"></script>
</body>
</html>
